<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thank You — Essor Automations</title>
<meta name="description" content="We have received your request and will contact you shortly.">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex,follow">
<link rel="icon" href="assets/img/favicon.ico" sizes="any">
<link rel="icon" href="assets/img/favicon-32.v1.png" type="image/png" sizes="32x32">
<link rel="icon" href="assets/img/favicon-16.v1.png" type="image/png" sizes="16x16">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.v1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<body>
<a class="skip-link" href="#main">Skip to content</a>
<div data-nav></div>

<main id="main" tabindex="-1">
<section class="section" style="min-height:60vh;display:grid;place-items:center">
  <div class="wrap center" style="max-width:640px">
    <div class="card-ico" data-icon="check"
         style="margin:0 auto var(--s-3);width:74px;height:74px;background:rgba(52,211,153,.14);border-color:rgba(52,211,153,.3);color:#34D399"></div>
    <h1>Thank you &mdash; we have your request</h1>
    <p class="lead">
      Our team is looking at your details and will contact you
      <strong style="color:var(--text)">within 24 hours</strong>.
      If you would rather talk sooner, message us on WhatsApp &mdash; that is where we reply fastest.
    </p>
    <div class="btn-row" style="margin-top:var(--s-4)">
      <a class="btn btn-wa btn-lg" data-cfg-href="whatsapp" href="#" target="_blank" rel="noopener">Message us on WhatsApp</a>
      <a class="btn btn-ghost btn-lg" href="products.html">Browse Products</a>
    </div>
    <p style="margin-top:var(--s-3);color:var(--text-faint);font-size:.88rem">
      Or call us on <a data-cfg-href="phone" href="#" style="color:var(--brand-2)"><span data-cfg="contact.phone"></span></a>
    </p>
  </div>
</section>
</main>

<div data-footer></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/main.js"></script>
